<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="452" viewBox="0 0 1120 452" role="img" aria-labelledby="title desc">
<title id="title">DWPM 动态因果权重与风险传播计算流程</title>
<desc id="desc">事件记录经审核和因子筛选形成有向风险网络；因果卷积、注意力和 Actor–Critic 计算动态边权，再进行容量负载传播与风险评价。训练目标用于参数更新，闭环推理使用当前可见历史。</desc>
